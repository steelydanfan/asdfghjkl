<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LineScale 3 Mobile</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between font-sans select-none touch-manipulation">

  <!-- Mobile Top Bar -->
  <header class="flex justify-between items-center p-4 bg-slate-800/80 backdrop-blur border-b border-slate-700/50">
    <div class="flex items-center space-x-2">
      <div id="statusDot" class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
      <span id="statusText" class="text-xs font-bold tracking-wider uppercase text-slate-400">Connecting...</span>
    </div>
    <button onclick="confirmPowerOff()" class="px-3 py-1 bg-red-950/60 border border-red-800/50 text-red-400 text-xs font-semibold rounded-lg active:scale-95 transition">
      Power Off (O)
    </button>
  </header>

  <!-- Main Display (Scale-App Layout) -->
  <main class="flex-1 flex flex-col justify-around p-4 space-y-4 overflow-y-auto">
    
    <!-- Primary Hero Tension Box -->
    <div class="bg-gradient-to-b from-slate-800 to-slate-800/60 p-6 rounded-3xl border border-slate-700/60 text-center shadow-2xl flex flex-col justify-center min-h-[180px]">
      <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Current Tension</span>
      <div id="valTension" class="text-6xl sm:text-7xl font-black text-blue-400 tracking-tight font-mono my-1">
        0.00 <span class="text-2xl font-normal text-slate-400">kN</span>
      </div>
    </div>

    <!-- Secondary Telemetry Cards -->
    <div class="grid grid-cols-3 gap-2">
      <!-- Peak Load -->
      <div class="bg-slate-800/60 p-3 rounded-2xl border border-slate-700/40 text-center">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Peak</span>
        <span id="valPeak" class="text-lg font-bold text-emerald-400 font-mono mt-1 block">--</span>
      </div>
      <!-- LS3 Battery -->
      <div class="bg-slate-800/60 p-3 rounded-2xl border border-slate-700/40 text-center">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Scale Bat</span>
        <span id="valLs3Bat" class="text-lg font-bold text-slate-200 font-mono mt-1 block">--</span>
      </div>
      <!-- Gateway Battery -->
      <div class="bg-slate-800/60 p-3 rounded-2xl border border-slate-700/40 text-center">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">GW Bat</span>
        <span id="valGwBat" class="text-lg font-bold text-slate-200 font-mono mt-1 block">--</span>
      </div>
    </div>

    <!-- Collapsible Mobile Chart -->
    <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/40 relative">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Live View</span>
        <button onclick="resetZoom()" class="text-[10px] bg-slate-700 text-slate-300 px-2 py-1 rounded">Reset Zoom</button>
      </div>
      <div class="h-44 w-full">
        <canvas id="tensionChart"></canvas>
      </div>
    </div>

  </main>

  <!-- Mobile Control Deck (Bottom Sheet Style) -->
  <footer class="bg-slate-800 border-t border-slate-700/80 p-4 space-y-3 rounded-t-3xl shadow-2xl">
    
    <!-- Primary Quick Actions -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="sendCommand('Z')" class="py-3 bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-xl text-center shadow-lg active:scale-95 transition">
        ZERO SCALE (Z)
      </button>
      <button onclick="sendCommand('C')" class="py-3 bg-amber-600 active:bg-amber-700 text-white font-bold rounded-xl text-center shadow-lg active:scale-95 transition flex flex-col items-center justify-center">
        <span class="text-sm leading-tight">CLEAR LOCAL PEAK</span>
        <span class="text-[9px] font-normal opacity-80">(ESP32 Memory)</span>
      </button>
    </div>

    <!-- Secondary Drawer Commands -->
    <div class="grid grid-cols-4 gap-2 pt-1">
      <!-- Stream Control -->
      <button onclick="sendCommand('A')" class="py-2 bg-slate-700 active:bg-slate-600 text-blue-300 font-semibold rounded-lg text-xs text-center">Start (A)</button>
      <button onclick="sendCommand('E')" class="py-2 bg-slate-700 active:bg-slate-600 text-slate-300 font-semibold rounded-lg text-xs text-center">Pause (E)</button>
      <!-- Mode & Rate -->
      <button onclick="sendCommand('L')" class="py-2 bg-slate-700 active:bg-slate-600 text-slate-300 font-semibold rounded-lg text-xs text-center">Rel/Abs (L)</button>
      <button onclick="toggleRate()" id="btnRate" class="py-2 bg-purple-900/50 border border-purple-700/50 text-purple-300 font-semibold rounded-lg text-xs text-center">Fast 40Hz</button>
    </div>

    <!-- Unit Toggle Selector -->
    <div class="flex justify-center bg-slate-900/60 p-1 rounded-xl border border-slate-700/50">
      <button onclick="sendCommand('N')" class="flex-1 py-1.5 text-xs font-bold text-slate-300 hover:text-white text-center focus:bg-blue-600 focus:text-white rounded-lg transition">kN</button>
      <button onclick="sendCommand('G')" class="flex-1 py-1.5 text-xs font-bold text-slate-300 hover:text-white text-center focus:bg-blue-600 focus:text-white rounded-lg transition">kgf</button>
      <button onclick="sendCommand('B')" class="flex-1 py-1.5 text-xs font-bold text-slate-300 hover:text-white text-center focus:bg-blue-600 focus:text-white rounded-lg transition">lbf</button>
    </div>

  </footer>

  <script src="app.js"></script>
</body>
</html>
